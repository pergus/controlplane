# Single-node Controlplane NATS server.
server_name: controlplane-nats

# Use loopback for local development. Change to 0.0.0.0 only when remote
# clients need access, and restrict access with a firewall.
listen: 127.0.0.1:4222
max_connections: 10000
max_subscriptions: 1000
max_payload: 1048576

# Local monitoring endpoints; do not expose publicly.
http: 127.0.0.1:8222

debug: false
trace: false
logtime: true

authorization {
  users = [
    {
      user: "admin"
      password: $NATS_ADMIN_PASSWORD
    },
    {
      user: $NATS_APP_USERNAME
      password: $NATS_APP_PASSWORD
      permissions {
        publish = {
          allow = [
            "controlplane.kinds.register",
            "events.>",
            "_INBOX.>",
            "$JS.API.>",
            "$JS.ACK.>",
            "$JS.FC.>"
          ]
        }
        subscribe = {
          allow = [
            "controlplane.kinds.register",
            "events.>",
            "_INBOX.>",
            "$JS.API.>",
            "$JS.ACK.>",
            "$JS.FC.>"
          ]
        }
      }
    }
  ]
}

jetstream {
  store_dir: "./.nats/jetstream"
  max_file_store: 5GB
  max_memory_store: 256MB
}

# To form a cluster, configure a unique server_name, a shared cluster name,
# listen on the route port, and add routes to the other servers.
# cluster {
#   name: controlplane-cluster
#   listen: 127.0.0.1:6222
#   routes = [nats://nats-2:6222, nats://nats-3:6222]
# }

# Enable TLS for connections across untrusted networks.
# tls {
#   cert_file: "/etc/nats/tls/server.crt"
#   key_file: "/etc/nats/tls/server.key"
#   ca_file: "/etc/nats/tls/ca.crt"
# }