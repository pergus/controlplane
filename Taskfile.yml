version: '3'

vars:
  BIN_DIR: bin

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  build:
    desc: Build all components
    cmds:
      - task: build-api-server
      - task: build-cpctl
      - task: build-dns-controller
      - task: build-certificate-controller

  build-cpctl:
    desc: Build the cpctl client
    cmds:
      - go build -o {{.BIN_DIR}}/cpctl ./cpctl

  build-api-server:
    desc: Build the API server
    cmds:
      - go build -o {{.BIN_DIR}}/api-server ./api-server

  build-dns-controller:
    desc: Build the DNS controller
    cmds:
      - go build -o {{.BIN_DIR}}/dns-controller ./dns-controller

  build-certificate-controller:
    desc: Build the certificate controller
    cmds:
      - go build -o {{.BIN_DIR}}/certificate-controller ./certificate-controller

  run:
    desc: Run NATS with JetStream and the API server
    cmds:
      - |
        export NATS_ADMIN_PASSWORD="${NATS_ADMIN_PASSWORD:-controlplane-admin-local}"
        export NATS_APP_USERNAME="${NATS_APP_USERNAME:-application}"
        export NATS_APP_PASSWORD="${NATS_APP_PASSWORD:-${NATS_PASSWORD:-controlplane-app-local}}"
        export NATS_USERNAME="${NATS_USERNAME:-$NATS_APP_USERNAME}"
        export NATS_PASSWORD="${NATS_PASSWORD:-$NATS_APP_PASSWORD}"
        nats-server -js -c ./nats-server.conf &
        nats_pid=$!
        trap 'kill "$nats_pid" 2>/dev/null || true; wait "$nats_pid" 2>/dev/null || true' EXIT
        go run ./api-server

  run-nats:
    desc: Run NATS with JetStream enabled
    cmds:
      - |
        export NATS_ADMIN_PASSWORD="${NATS_ADMIN_PASSWORD:-controlplane-admin-local}"
        export NATS_APP_USERNAME="${NATS_APP_USERNAME:-application}"
        export NATS_APP_PASSWORD="${NATS_APP_PASSWORD:-${NATS_PASSWORD:-controlplane-app-local}}"
        nats-server -js -c ./nats-server.conf

  run-dns:
    desc: Run the DNS controller
    cmds:
      - go run ./dns-controller

  run-certificate:
    desc: Run the certificate controller
    cmds:
      - go run ./certificate-controller

  run-cpctl:
    desc: Run cpctl
    cmds:
      - go run ./cpctl {{.CLI_ARGS}}

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  test-dns:
    desc: Test DNS controller with 20 resources
    cmds:
      - ./scripts/test-dns-controller.sh

  test-certificates:
    desc: Test certificate controller with 20 resources
    cmds:
      - ./scripts/test-certificate-controller.sh

  test-controllers:
    desc: Run controller integration tests
    cmds:
      - ./scripts/test-controllers.sh

  fmt:
    desc: Format Go source files
    cmds:
      - gofmt -w .

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  check:
    desc: Run formatting, tests, and static analysis
    cmds:
      - task: fmt
      - task: test
      - task: vet

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}}